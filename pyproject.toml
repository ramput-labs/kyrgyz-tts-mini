[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-mini"
dynamic = ["version"]
description = "Small, fast Kyrgyz text-to-speech"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
requires-python = ">=3.11"
keywords = ["kyrgyz", "tts", "text-to-speech"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: Kyrgyz",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "torch>=2.6",
    "numpy",
    "einops",
    "omegaconf",
    "soundfile",
    "sounddevice",
    "gdown",
]

[project.optional-dependencies]
demo = ["gradio>=4"]
dev = ["pytest", "ruff", "build"]

[project.scripts]
tts-mini = "tts_mini.cli:main"

[tool.setuptools.dynamic]
version = { attr = "tts_mini.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: needs the downloaded models (deselect with -m 'not models')"]

[tool.ruff]
line-length = 120
src = ["src"]
extend-exclude = ["src/tts_mini/acoustic", "src/tts_mini/vocoder"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
